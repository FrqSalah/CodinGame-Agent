name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilation, tests et image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # L'image compile la solution et joue les tests, parties réelles avec le moteur comprises.
      - name: Image Docker (compilation + tests)
        run: docker build -t codingame-farm:ci .

  deploy:
    name: Publier pour le VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Le VPS suit la branche « deploy » : elle n'avance que sur un commit validé.
      - name: Avancer la branche deploy
        run: git push --force origin HEAD:refs/heads/deploy

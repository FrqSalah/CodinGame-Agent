name: Deploy to OVH VPS

on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch: # Permet de déclencher le déploiement manuellement depuis GitHub

jobs:
  deploy:
    name: Deploy to OVH VPS via SSH
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH on OVH VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: ${{ secrets.OVH_PORT || 22 }}
          script_stop: true
          script: |
            DEPLOY_PATH="${{ secrets.OVH_DEPLOY_PATH || '/opt/codingame-agent' }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "=== Déploiement dans $DEPLOY_PATH ==="

            # 1. Cloner le dépôt si nécessaire, ou récupérer la dernière version
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Clonage initial du dépôt..."
              sudo mkdir -p "$DEPLOY_PATH"
              sudo chown -R $USER:$USER "$DEPLOY_PATH"
              git clone "$REPO_URL" "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            else
              echo "Mise à jour du dépôt existant..."
              cd "$DEPLOY_PATH"
              git fetch origin main
              git reset --hard origin/main
            fi

            # 2. Préparer le fichier .env si non présent
            if [ ! -f .env ]; then
              echo "Création du fichier .env initial depuis env.template..."
              cp env.template .env
            fi

            # 3. Lancer / Reconstruire les conteneurs Docker
            echo "Construction et démarrage des conteneurs avec Docker Compose..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # 4. Nettoyage des images orphelines
            docker image prune -f

            # 5. Vérification du statut
            echo "=== État des conteneurs ==="
            docker compose ps
